<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGOS - Water Level Control</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 800px;
        width: 100%;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
        font-size: 2.5em;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1em;
      }

      .status-bar {
        background: #f0f0f0;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 30px;
        text-align: center;
      }

      .status-bar .connection-status {
        display: inline-block;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9em;
      }

      .status-bar .connected {
        background: #4caf50;
        color: white;
      }

      .status-bar .disconnected {
        background: #f44336;
        color: white;
      }

      .water-container {
        position: relative;
        width: 200px;
        height: 400px;
        margin: 0 auto 40px;
        background: linear-gradient(to bottom, #e3f2fd 0%, #bbdefb 100%);
        border: 4px solid #333;
        border-radius: 10px;
        overflow: hidden;
      }

      .water-level {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(to top, #2196f3 0%, #64b5f6 100%);
        transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .water-level::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 0;
        right: 0;
        height: 20px;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.3) 0%,
          transparent 70%
        );
        animation: wave 3s ease-in-out infinite;
      }

      @keyframes wave {
        0%,
        100% {
          transform: translateX(-25%) rotate(0deg);
        }
        50% {
          transform: translateX(25%) rotate(180deg);
        }
      }

      .level-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2em;
        font-weight: bold;
        color: #333;
        text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        z-index: 10;
      }

      .level-markers {
        position: absolute;
        right: -60px;
        top: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .marker {
        font-size: 0.9em;
        color: #666;
        font-weight: bold;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-top: 30px;
      }

      .control-btn {
        padding: 30px;
        font-size: 1.3em;
        font-weight: bold;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }

      .control-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
      }

      .control-btn:active {
        transform: translateY(-2px);
      }

      .control-btn.active {
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5),
          0 0 20px rgba(0, 0, 0, 0.3);
        transform: scale(1.05);
      }

      .control-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .control-btn:active::after {
        width: 300px;
        height: 300px;
      }

      .btn-clear {
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        color: white;
      }

      .btn-half {
        background: linear-gradient(135deg, #ffc107 0%, #ffb300 100%);
        color: white;
      }

      .btn-knee {
        background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        color: white;
      }

      .btn-waist {
        background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        color: white;
      }

      .btn-level {
        display: block;
        font-size: 0.7em;
        opacity: 0.9;
        margin-top: 5px;
      }

      .last-command {
        text-align: center;
        margin-top: 20px;
        padding: 10px;
        background: #f5f5f5;
        border-radius: 8px;
        font-size: 0.9em;
        color: #666;
      }

      @media (max-width: 600px) {
        .container {
          padding: 20px;
        }

        h1 {
          font-size: 1.8em;
        }

        .button-grid {
          grid-template-columns: 1fr;
        }

        .water-container {
          width: 150px;
          height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌊 AGOS Water Level Control</h1>
      <p class="subtitle">Advanced Ground Observation System</p>

      <div class="status-bar">
        <span class="connection-status disconnected" id="connectionStatus">
          ⚠️ Connecting to Server...
        </span>
      </div>

      <div class="water-container">
        <div class="water-level" id="waterLevel">
          <div class="level-text" id="levelText">0"</div>
        </div>
      </div>

      <div class="button-grid">
        <button
          class="control-btn btn-clear active"
          onclick="setWaterLevel(0, this)"
        >
          🟢 CLEAR
          <span class="btn-level">0 inches</span>
        </button>
        <button class="control-btn btn-half" onclick="setWaterLevel(2, this)">
          🟡 2 INCHES
          <span class="btn-level">2 inches</span>
        </button>
        <button class="control-btn btn-knee" onclick="setWaterLevel(10, this)">
          🟠 10 INCHES
          <span class="btn-level">10 inches</span>
        </button>
        <button class="control-btn btn-waist" onclick="setWaterLevel(19, this)">
          🔴 19 INCHES
          <span class="btn-level">19 inches</span>
        </button>
      </div>

      <div class="last-command" id="lastCommand">
        Ready to send commands to Arduino...
      </div>
    </div>

    <script>
      let ws = null;
      let currentLevel = 0;
      const maxHeight = 19; // inches (maximum water level)

      // WebSocket connection
      function connectWebSocket() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.hostname}:${
          window.location.port || 3000
        }`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          console.log("✅ Connected to AGOS server");
          document.getElementById("connectionStatus").textContent =
            "✅ Connected to Server";
          document.getElementById("connectionStatus").className =
            "connection-status connected";
        };

        ws.onclose = () => {
          console.log("❌ Disconnected from server");
          document.getElementById("connectionStatus").textContent =
            "❌ Disconnected - Reconnecting...";
          document.getElementById("connectionStatus").className =
            "connection-status disconnected";
          setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = (error) => {
          console.error("WebSocket error:", error);
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "water-level") {
              updateWaterDisplay(data.level);
            }
          } catch (e) {
            console.error("Error parsing message:", e);
          }
        };
      }

      function setWaterLevel(inches, buttonElement) {
        currentLevel = inches;

        // Update visual display in this page
        updateWaterDisplay(inches);

        // Remove active class from all buttons
        document.querySelectorAll(".control-btn").forEach((btn) => {
          btn.classList.remove("active");
        });

        // Add active class to clicked button (stays clicked)
        if (buttonElement) {
          buttonElement.classList.add("active");
        }

        // Send water level to Module 1 via WebSocket
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "water-level-control",
              level: inches,
              timestamp: new Date().toISOString(),
            })
          );

          document.getElementById(
            "lastCommand"
          ).textContent = `✅ Water level set to ${inches} inches - Sent to Module 1`;
          console.log(
            `💧 Water level changed to: ${inches} inches - Broadcasting to Module 1`
          );
        } else {
          document.getElementById(
            "lastCommand"
          ).textContent = `⚠️ Water level set to ${inches} inches - Not connected to server`;
          console.warn("WebSocket not connected, cannot send to Module 1");
        }
      }

      function updateWaterDisplay(inches) {
        const percentage = (inches / maxHeight) * 100;
        const waterElement = document.getElementById("waterLevel");
        const textElement = document.getElementById("levelText");

        waterElement.style.height = percentage + "%";
        textElement.textContent = inches + '"';

        // Change water color based on level
        if (inches === 0) {
          waterElement.style.background =
            "linear-gradient(to top, #90CAF9 0%, #BBDEFB 100%)";
        } else if (inches <= 2) {
          waterElement.style.background =
            "linear-gradient(to top, #66BB6A 0%, #81C784 100%)";
        } else if (inches <= 10) {
          waterElement.style.background =
            "linear-gradient(to top, #FFA726 0%, #FFB74D 100%)";
        } else if (inches <= 19) {
          waterElement.style.background =
            "linear-gradient(to top, #EF5350 0%, #E57373 100%)";
        } else {
          waterElement.style.background =
            "linear-gradient(to top, #B71C1C 0%, #C62828 100%)";
        }
      }

      // Initialize
      connectWebSocket();
      updateWaterDisplay(0);

      // Handle page visibility to reconnect WebSocket
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            connectWebSocket();
          }
        }
      });
    </script>
  </body>
</html>
