<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGOS - Water Level Control</title>
    <link rel="stylesheet" href="/water-level-control.css" />
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>🌊 AGOS Water Level Control</h1>
      <p class="subtitle">Advanced Ground Observation System</p>

      <div class="status-bar">
        <span class="connection-status disconnected" id="connectionStatus">
          ⚠️ Connecting to Server...
        </span>
      </div>

      <div class="water-container">
        <div class="water-level" id="waterLevel">
          <div class="level-text" id="levelText">0"</div>
        </div>
      </div>

      <div class="button-grid">
        <button class="control-btn btn-clear active" data-level="0">
          🟢 CLEAR
          <span class="btn-level">0 inches</span>
        </button>
        <button class="control-btn btn-half" data-level="2">
          🟡 2 INCHES
          <span class="btn-level">2 inches</span>
        </button>
        <button class="control-btn btn-knee" data-level="10">
          🟠 10 INCHES
          <span class="btn-level">10 inches</span>
        </button>
        <button class="control-btn btn-waist" data-level="19">
          🔴 19 INCHES
          <span class="btn-level">19 inches</span>
        </button>
      </div>

      <div class="last-command" id="lastCommand">
        Click a button to set water level...
      </div>
    </div>

    <script src="/water-level-control.js" defer></script>
  </body>
</html>
